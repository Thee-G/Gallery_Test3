<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily — Thee-Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;1,300&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --bg-2:    #111111;
      --bg-3:    #1a1a1a;
      --border:  rgba(255,255,255,0.07);
      --border-h:rgba(255,255,255,0.15);
      --text:    #f0ece4;
      --muted:   #7a7570;
      --faint:   #3a3835;
      --accent:  #c9b99a;
      --accent-d:rgba(201,185,154,0.1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.35;
    }

    .page {
      width: 100%;
      max-width: 680px;
      padding: 3rem 2rem 5rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }

    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.08em;
      color: var(--text);
      text-decoration: none;
    }

    .topbar-logo span { color: var(--accent); }

    .topbar-date {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── IMAGE BOX ── */
    .image-box {
      width: 100%;
      aspect-ratio: 4/3;
      background: var(--bg-3);
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      margin-bottom: 1px;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(10%) contrast(1.05);
    }

    .image-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }

    .image-placeholder svg {
      opacity: 0.12;
      width: 48px;
      height: 48px;
    }

    .image-placeholder span {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* ── TEXT BOX ── */
    .text-box {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-top: none;
      padding: 2rem 2.2rem;
      margin-bottom: 2rem;
    }

    .text-box-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 1rem;
    }

    .text-box-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.03em;
      line-height: 0.95;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .text-box-body {
      font-size: 1.3rem;
      font-weight: 300;
      color: #f0ece4;
      line-height: 1.85;
    }

    /* ── LINKS ROW ── */
    .links-row {
      display: flex;
      gap: 0;
      margin-bottom: 3rem;
      border: 1px solid var(--border);
    }

    .link-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      padding: 1rem 1.5rem;
      text-decoration: none;
      color: var(--muted);
      border-right: 1px solid var(--border);
      transition: background 0.2s, color 0.2s;
    }

    .link-item:last-child { border-right: none; }

    .link-item:hover {
      background: var(--accent-d);
      color: var(--accent);
    }

    .link-item:hover .link-icon { stroke: var(--accent); }

    .link-icon {
      width: 18px;
      height: 18px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: stroke 0.2s;
    }

    .link-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    
  </style>
</head>
<body>
<div class="page">

  <!-- TOP BAR -->
  <div class="topbar">
    <a href="index.html" class="topbar-logo">Thee<span>—</span>Gallery</a>
    <span class="topbar-date" id="today-date"></span>
  </div>

  <!-- IMAGE BOX -->
  <div class="image-box">
    <img src="images/apple1.jpg" alt="apple">
    <div class="image-placeholder">
      <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="m21 15-5-5L5 21"/>
      </svg>
      <span>Your image here</span>
    </div>
  </div>

  <!-- TEXT BOX -->
  <div class="text-box">
    <p class="text-box-label">Today's Entry</p>
    <h2 class="text-box-title">Gerçekten En Ufak Fikrim Yok.</h2>
    <p class="text-box-body">
      Var gibi duruyo biliyorum ama yok..
    </p>
  </div>

  <!-- LINKS ROW -->
  <div class="links-row">
    <a href="https://open.spotify.com/user/11179309897?si=yH1QufnIQR-gXwrvtaw_Ew" target="https://open.spotify.com/user/11179309897?si=yH1QufnIQR-gXwrvtaw_Ew" class="link-item">
      <svg class="link-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 11.5c2.5-1 5.5-.8 7.5.5M7.5 14.5c2-0.8 5-.6 7 .5M9 17c1.5-.5 3.5-.5 5 .2"/>
      </svg>
      <span class="link-label">Spotify</span>
    </a>
    <a href="https://instagram.com/sodiumthiopental1" target="https://instagram.com/sodiumthiopental1" class="link-item">
      <svg class="link-icon" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
      </svg>
      <span class="link-label">Instagram</span>
    </a>
  </div>
</body>
</html>
