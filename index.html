<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily — Thee-Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;1,300&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --bg-2:    #111111;
      --bg-3:    #1a1a1a;
      --border:  rgba(255,255,255,0.07);
      --border-h:rgba(255,255,255,0.15);
      --text:    #f0ece4;
      --muted:   #7a7570;
      --faint:   #3a3835;
      --accent:  #c9b99a;
      --accent-d:rgba(201,185,154,0.1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.35;
    }

    .page {
      width: 100%;
      max-width: 680px;
      padding: 3rem 2rem 5rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }

    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.08em;
      color: var(--text);
      text-decoration: none;
    }

    .topbar-logo span { color: var(--accent); }

    .topbar-date {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── IMAGE BOX ── */
    .image-box {
      width: 100%;
      aspect-ratio: 4/3;
      background: var(--bg-3);
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      margin-bottom: 1px;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(10%) contrast(1.05);
    }

    .image-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }

    .image-placeholder svg {
      opacity: 0.12;
      width: 48px;
      height: 48px;
    }

    .image-placeholder span {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* ── TEXT BOX ── */
    .text-box {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-top: none;
      padding: 2rem 2.2rem;
      margin-bottom: 2rem;
    }

    .text-box-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 1rem;
    }

    .text-box-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.03em;
      line-height: 0.95;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .text-box-body {
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.85;
    }

    /* ── LINKS ROW ── */
    .links-row {
      display: flex;
      gap: 0;
      margin-bottom: 3rem;
      border: 1px solid var(--border);
    }

    .link-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      padding: 1rem 1.5rem;
      text-decoration: none;
      color: var(--muted);
      border-right: 1px solid var(--border);
      transition: background 0.2s, color 0.2s;
    }

    .link-item:last-child { border-right: none; }

    .link-item:hover {
      background: var(--accent-d);
      color: var(--accent);
    }

    .link-item:hover .link-icon { stroke: var(--accent); }

    .link-icon {
      width: 18px;
      height: 18px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: stroke 0.2s;
    }

    .link-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* ── PLAYER ── */
    .player-wrap {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg-2);
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.4rem;
      border-bottom: 1px solid var(--border);
    }

    .player-header-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .player-live {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #1DB954;
    }

    .player-live-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #1DB954;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .player-body {
      padding: 1.5rem 1.4rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .player-track {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .player-art {
      width: 56px;
      height: 56px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      color: var(--faint);
      letter-spacing: 0.05em;
      overflow: hidden;
    }

    .player-art img { width: 100%; height: 100%; object-fit: cover; }

    .player-info { flex: 1; min-width: 0; }

    .player-song {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.05em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* controls */
    .player-controls {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: color 0.2s, transform 0.15s;
    }

    .ctrl-btn:hover { color: var(--text); }
    .ctrl-btn:active { transform: scale(0.9); }

    .ctrl-btn svg {
      width: 18px; height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ctrl-btn.play svg {
      width: 22px; height: 22px;
    }

    .ctrl-btn.play.playing .icon-play { display: none; }
    .ctrl-btn.play:not(.playing) .icon-pause { display: none; }

    .progress-wrap { flex: 1; display: flex; align-items: center; gap: 0.8rem; }

    .time {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--faint);
      min-width: 28px;
    }

    .progress-track {
      flex: 1;
      height: 2px;
      background: var(--faint);
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s linear;
      pointer-events: none;
    }

    .progress-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      left: 0%;
      transition: left 0.25s linear;
      pointer-events: none;
    }

    /* playlist */
    .playlist {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .pl-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .pl-item:last-child { border-bottom: none; }
    .pl-item:hover .pl-title { color: var(--accent); }
    .pl-item.active .pl-title { color: var(--accent); }
    .pl-item.active .pl-num { color: var(--accent); }

    .pl-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      color: var(--faint);
      min-width: 20px;
      text-align: right;
      transition: color 0.2s;
    }

    .pl-info { flex: 1; min-width: 0; }

    .pl-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s;
    }

    .pl-artist {
      font-size: 0.65rem;
      font-weight: 300;
      color: var(--faint);
    }

    .pl-dur {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--faint);
    }

    @media (max-width: 500px) {
      .page { padding: 2rem 1.2rem 4rem; }
      .topbar-logo { font-size: 1.6rem; }
      .links-row { flex-direction: column; }
      .link-item { border-right: none; border-bottom: 1px solid var(--border); }
      .link-item:last-child { border-bottom: none; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- TOP BAR -->
  <div class="topbar">
    <a href="index.html" class="topbar-logo">Thee<span>—</span>Gallery</a>
    <span class="topbar-date" id="today-date"></span>
  </div>

  <!-- IMAGE BOX -->
  <div class="image-box">
    <img src="images/apple1.jpg" alt="apple">
    <div class="image-placeholder">
      <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="m21 15-5-5L5 21"/>
      </svg>
      <span>Your image here</span>
    </div>
  </div>

  <!-- TEXT BOX -->
  <div class="text-box">
    <p class="text-box-label">Today's Entry</p>
    <h2 class="text-box-title">Gerçekten En Ufak Fikrim Yok.</h2>
    <p class="text-box-body">
      Var gibi duruyo biliyorum ama yok..
    </p>
  </div>

  <!-- LINKS ROW -->
  <div class="links-row">
    <a href="https://open.spotify.com/user/11179309897?si=yH1QufnIQR-gXwrvtaw_Ew" target="https://open.spotify.com/user/11179309897?si=yH1QufnIQR-gXwrvtaw_Ew" class="link-item">
      <svg class="link-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 11.5c2.5-1 5.5-.8 7.5.5M7.5 14.5c2-0.8 5-.6 7 .5M9 17c1.5-.5 3.5-.5 5 .2"/>
      </svg>
      <span class="link-label">Spotify</span>
    </a>
    <a href="https://instagram.com/sodiumthiopental1" target="https://instagram.com/sodiumthiopental1" class="link-item">
      <svg class="link-icon" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
      </svg>
      <span class="link-label">Instagram</span>
    </a>
  </div>

  <!-- PLAYER -->
  <div class="player-wrap">
    <div class="player-header">
      <span class="player-header-label">Now Playing</span>
      <div class="player-live"><div class="player-live-dot"></div>Live Queue</div>
    </div>
    <div class="player-body">

      <div class="player-track">
        <div class="player-art" id="art-display">TG</div>
        <div class="player-info">
          <div class="player-song" id="song-name">Select a track</div>
          <div class="player-artist" id="song-artist">—</div>
        </div>
      </div>

      <div class="player-controls">
        <button class="ctrl-btn" id="btn-prev" aria-label="Previous" onclick="prevTrack()">
          <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <button class="ctrl-btn play" id="btn-play" aria-label="Play" onclick="togglePlay()">
          <svg viewBox="0 0 24 24" class="icon-play"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg viewBox="0 0 24 24" class="icon-pause"><line x1="10" y1="15" x2="10" y2="9"/><line x1="14" y1="15" x2="14" y2="9"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" aria-label="Next" onclick="nextTrack()">
          <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
        <div class="progress-wrap">
          <span class="time" id="time-cur">0:00</span>
          <div class="progress-track" id="progress-track" onclick="seek(event)">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-thumb" id="progress-thumb"></div>
          </div>
          <span class="time" id="time-dur">0:00</span>
        </div>
      </div>

      <div class="playlist" id="playlist"></div>

    </div>
  </div>

</div>

<script>
  // ── DATE ──
  const d = new Date();
  const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
  document.getElementById('today-date').textContent = d.toLocaleDateString('en-US', opts).toUpperCase();

  // ── PLAYER ──
  // Add your own tracks below. Use relative paths or URLs.
  // src: '' means no audio file yet — the player UI still works as a mockup.
  const tracks = [
    { title: 'Your Track One',   artist: 'Artist Name', src: '', dur: '3:42', label: 'TG' },
    { title: 'Your Track Two',   artist: 'Artist Name', src: '', dur: '4:15', label: 'TG' },
    { title: 'Your Track Three', artist: 'Artist Name', src: '', dur: '2:58', label: 'TG' },
  ];

  let current = 0;
  let audio = new Audio();
  let playing = false;
  let raf;

  function fmtTime(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function buildPlaylist() {
    const pl = document.getElementById('playlist');
    pl.innerHTML = tracks.map((t, i) => `
      <div class="pl-item${i === current ? ' active' : ''}" onclick="loadTrack(${i}, true)">
        <span class="pl-num">${String(i+1).padStart(2,'0')}</span>
        <div class="pl-info">
          <div class="pl-title">${t.title}</div>
          <div class="pl-artist">${t.artist}</div>
        </div>
        <span class="pl-dur">${t.dur}</span>
      </div>`).join('');
  }

  function updateHeader(i) {
    const t = tracks[i];
    document.getElementById('song-name').textContent = t.title;
    document.getElementById('song-artist').textContent = t.artist;
    document.getElementById('art-display').textContent = t.label;
  }

  function loadTrack(i, autoplay) {
    current = i;
    const t = tracks[i];
    audio.pause();
    cancelAnimationFrame(raf);
    audio = new Audio(t.src);
    audio.addEventListener('ended', nextTrack);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('time-dur').textContent = fmtTime(audio.duration);
    });
    updateHeader(i);
    buildPlaylist();
    setProgress(0);
    if (autoplay) { audio.play().catch(()=>{}); playing = true; }
    else { playing = false; }
    document.getElementById('btn-play').classList.toggle('playing', playing);
  }

  function togglePlay() {
    if (!tracks[current].src) { return; }
    if (playing) { audio.pause(); playing = false; }
    else { audio.play().catch(()=>{}); playing = true; }
    document.getElementById('btn-play').classList.toggle('playing', playing);
  }

  function nextTrack() { loadTrack((current + 1) % tracks.length, playing); }
  function prevTrack() { loadTrack((current - 1 + tracks.length) % tracks.length, playing); }

  function setProgress(pct) {
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-thumb').style.left = pct + '%';
  }

  function updateProgress() {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    setProgress(pct);
    document.getElementById('time-cur').textContent = fmtTime(audio.currentTime);
  }

  function seek(e) {
    if (!audio.duration) return;
    const rect = document.getElementById('progress-track').getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.currentTime = pct * audio.duration;
    setProgress(pct * 100);
  }

  updateHeader(0);
  buildPlaylist();
</script>
</body>
</html>
